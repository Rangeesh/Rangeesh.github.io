title: Rangeesh Venkatesan
author: Rangeesh Venkatesan
description: "Robotics, learning, and the systems that make them work. Selected work and personal writing by Rangeesh Venkatesan."
url: "https://rangeesh.github.io"
baseurl: ""
email: rangeeshvenkat@gmail.com
linkedin: "https://linkedin.com/in/rangeesh/"
github_url: "https://github.com/Rangeesh"
avatar: "/assets/img/rangeesh.jpeg"
language: en
timezone: America/Los_Angeles
markdown: kramdown
highlighter: rouge
# Retain published article URLs.
permalink: /:year-:month-:day-:title/
excerpt_separator: "<!--more-->"
excerpt_length: 50
rss-description: "Writing on robotics, machine learning, engineering, and life by Rangeesh Venkatesan."
kramdown:
  input: GFM
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      category: Personal
exclude:
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .bundle
plugins:
  - jekyll-sitemap
